name: Refresh warehouse

# Fetches the live sources, rebuilds the warehouse, runs the full quality
# suite and commits the regenerated dashboard.
#
# Manual by default. To run it weekly, uncomment the schedule block below -
# it is left off so the repository never pushes commits unprompted.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 18 * * 1"   # Mondays, 18:00 UTC

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run the pipeline against the live sources
        run: python -m pipelines.cli all

      # A blocking quality failure fails the step above, so nothing is
      # committed from a warehouse that did not pass its assertions.
      - name: Commit the regenerated dashboard
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "Dashboard unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "chore: refresh dashboard from upstream sources"
          git push
